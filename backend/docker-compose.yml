version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: storeit-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: storeit
      POSTGRES_USER: storeit
      POSTGRES_PASSWORD: storeit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storeit"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # MinIO's official images are no longer anonymously pullable (2026).
    # Silo is a drop-in MinIO-compatible fork (same S3 API / env vars).
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: storeit-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # The browser talks directly to MinIO using presigned URLs.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:

version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: storeit-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: storeit
      POSTGRES_USER: storeit
      POSTGRES_PASSWORD: storeit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storeit"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
